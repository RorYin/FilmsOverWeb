version: '3.8'

services:
  filmsoverweb:
    build: .
    container_name: filmsoverweb
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      # - SECRET_KEY=your-secret-key-here
      # - TMDB_API_KEY=your-tmdb-key-here
    volumes:
      # Direct JSON database persistence on host
      - ./films_over_web.json:/app/films_over_web.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
